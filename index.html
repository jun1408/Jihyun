<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>떡 하나 주면 안 잡아먹지</title>
    <style>
      body {
        margin: 0;
        width: 100%;
        min-height: 100svh;
        background: #1d2a22;
        overflow: hidden;
      }

      #game {
        width: 100%;
        height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game canvas {
        display: block;
        margin: auto;
      }
    </style>
    <script type="module">
      function startWithoutSdk() {
        if (window.ONEStoreReady) return;
        window.ONEStoreReady = true;
        // setTimeout(0): main.js 리스너 등록이 끝난 뒤 발송
        setTimeout(() => document.dispatchEvent(new Event("onestore:ready")), 0);
      }

      // 동적 import: CDN 로드 실패(로컬/네트워크 없음)도 .catch()로 처리
      import("https://h5sdk.onestore.net/lib/v1.2.0/onestore-h5-sdk.min.js")
        .then(({ createSDK }) => {
          const sdk = createSDK();

          // 라이프사이클 — initializeAsync 이전에 등록
          sdk.on("pause", () => {
            document.dispatchEvent(new Event("onestore:pause"));
          });
          sdk.on("resume", () => {
            document.dispatchEvent(new Event("onestore:resume"));
          });
          sdk.on("exit", () => {});

          sdk.initializeAsync()
            .then((info) => {
              if (info.err) {
                // 원스토어 앱 외부(일반 브라우저) → SDK 없이 바로 시작
                startWithoutSdk();
                return;
              }
              // 원스토어 앱 내부
              window._oneStoreSDK = sdk;
              setTimeout(() => document.dispatchEvent(new Event("onestore:init")), 0);
            })
            .catch(() => startWithoutSdk());
        })
        .catch(() => startWithoutSdk()); // SDK CDN 로드 실패 → 바로 게임 시작
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  </head>
  <body>
    <main id="game"></main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
